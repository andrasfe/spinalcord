[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afferent"
dynamic = ["version"]
description = "A backend-agnostic sensorimotor protocol — eyes and hands for cognitive agents driving a computer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Andras Ferenczi", email = "andrasf94@gmail.com" }]
keywords = [
    "agent", "computer-use", "embodiment", "sensorimotor",
    "automation", "gui-automation", "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Intentionally dependency-free (stdlib only): the type protocol, the
# SafetyGate, the Embodiment facade, and the FakeBackend import with nothing
# but the standard library. Real-body backends bring their own deps.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://github.com/andrasfe/spinalcord"
Repository = "https://github.com/andrasfe/spinalcord"
Issues = "https://github.com/andrasfe/spinalcord/issues"

[tool.hatch.version]
# Single source of truth — bump __version__ in afferent/__init__.py only.
path = "afferent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["afferent"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
