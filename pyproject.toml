[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spinalcord"
version = "0.1.0"
description = "A backend-agnostic sensorimotor protocol — eyes and hands for cognitive agents driving a computer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Andras Ferenczi", email = "andrasf94@gmail.com" }]
keywords = [
    "agent", "computer-use", "embodiment", "sensorimotor",
    "automation", "gui-automation", "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core is intentionally dependency-free (stdlib only): the type protocol,
# the SafetyGate, the Embodiment facade, and the FakeBackend all import with
# nothing but the standard library. Only the HTTP backend needs httpx.
dependencies = []

[project.optional-dependencies]
handsneyes = ["httpx>=0.27"]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/andrasfe/spinalcord"
Repository = "https://github.com/andrasfe/spinalcord"
Issues = "https://github.com/andrasfe/spinalcord/issues"

[tool.hatch.build.targets.wheel]
packages = ["spinalcord"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
