name: Publish to PyPI

# Builds and publishes spinalcord when a GitHub Release is published.
#
# Uses PyPI Trusted Publishing (OIDC) — NO API token stored anywhere.
# One-time setup on PyPI:
#   1. Create the project (first upload can be manual via scripts/release.sh,
#      or configure a "pending" trusted publisher before the first release).
#   2. PyPI → your project → Settings → Publishing → Add a trusted publisher:
#        Owner:        andrasfe
#        Repository:   spinalcord
#        Workflow:     publish.yml
#        Environment:  pypi
#   3. (Optional) create a GitHub Environment named "pypi" for extra gating.
#
# To publish: bump __version__ in spinalcord/__init__.py, commit, then cut a
# GitHub Release (tag vX.Y.Z). This workflow does the rest.

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py' -t .

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
